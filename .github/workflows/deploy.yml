name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      # The server pins this key to /usr/local/bin/deploy-kindred-api (authorized_keys
      # `restrict,command=...`), so no remote command is sent: connecting IS the deploy.
      # deploy-kindred-api pulls main, backs up the database, rebuilds the app image,
      # runs `prisma migrate deploy`, restarts the app and fails unless { health } is "ok".
      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST"

      - name: Public health check
        run: |
          RESPONSE=$(curl -sf -X POST https://api.kindredcook.app/v1/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ health }"}' || true)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"health":"ok"'

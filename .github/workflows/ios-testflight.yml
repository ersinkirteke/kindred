name: iOS TestFlight

# Builds the iOS app on a GitHub macOS runner and uploads it to TestFlight.
# Run it by hand: Actions → iOS TestFlight → Run workflow.
# Signing uses the "Kindred AppStore CI" profile + its Apple Distribution
# certificate, stored as repository secrets (never committed).

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (empty = git commit count)'
        required: false

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Kindred

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit count = build number

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"
          KC_PW=$(uuidgen)
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "Installed profile $UUID"

      - name: Set build number and manual signing (CI only, not committed)
        run: |
          BUILD="${{ inputs.build_number }}"
          [ -n "$BUILD" ] || BUILD=$(git rev-list --count HEAD)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          PBX=Kindred.xcodeproj/project.pbxproj
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $BUILD;/" "$PBX"
          plutil -replace CFBundleVersion -string "$BUILD" Sources/Info.plist
          # App target, Release config only: Apple Distribution + the CI profile.
          perl -0pi -e 's/(\/\* Release \*\/ = \{(?:(?!name = ).)*?)CODE_SIGN_IDENTITY = "iPhone Developer";/$1CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Kindred AppStore CI";/s' "$PBX"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER = "Kindred AppStore CI"' "$PBX"
          echo "Build number: $BUILD"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Kindred.xcodeproj \
            -scheme Kindred \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kindred.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(\*\*|error:|.*: error:|.*warning: .*signing)' || true
          test -d "$RUNNER_TEMP/Kindred.xcarchive/Products/Applications/Kindred.app"

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          retention-days: 7

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          P8="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$P8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>CV9G42QVG4</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ersinkirteke.kindred</key><string>Kindred AppStore CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kindred.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$P8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Build $BUILD uploaded to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 5–30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP/dist.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
